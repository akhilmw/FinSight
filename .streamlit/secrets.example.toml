# Copy these values into Streamlit Community Cloud's Advanced settings.
# Never commit real credentials to this file or to Git.

FINSIGHT_ENVIRONMENT = "production"
FINSIGHT_DATABASE_URL = "postgresql+psycopg://USER:PASSWORD@HOST/DATABASE?sslmode=require"
FINSIGHT_REDIS_URL = "rediss://default:PASSWORD@HOST:PORT"
FINSIGHT_OPENAI_API_KEY = "sk-..."

FINSIGHT_SEC_USER_AGENT = "FinSight your-email@example.com"
FINSIGHT_ANSWER_MODEL = "gpt-4o-mini"
FINSIGHT_EMBEDDING_MODEL = "text-embedding-3-small"
FINSIGHT_EMBEDDING_DIMENSIONS = 1536
FINSIGHT_RERANKER_MODEL = "cross-encoder/ms-marco-MiniLM-L-6-v2"
FINSIGHT_ANSWER_CACHE_TTL_SECONDS = 86400

# The Streamlit app does not run Celery, but Settings validates these fields.
FINSIGHT_CELERY_BROKER_URL = "redis://localhost:6379/1"
FINSIGHT_CELERY_RESULT_BACKEND = "redis://localhost:6379/1"
